name: Capability contract CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  capability-contract:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify current capability evidence
        shell: pwsh
        run: |
          $asOf = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
          npm run capabilities:verify -- --as-of $asOf
